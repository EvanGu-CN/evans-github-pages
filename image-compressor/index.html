<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="在浏览器本地批量压缩图片，调整画质和尺寸，支持 WebP、JPEG 和 PNG。">
  <title>图片压缩 | 小工具集</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="compressor.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main class="container compressor">
    <nav class="topbar">
      <a class="back" href="../">← 返回工具集</a>
      <div class="eyebrow">EVAN'S TOOLBOX</div>
    </nav>

    <header class="page-head">
      <div class="kicker">IMAGE TOOL / 05</div>
      <h1>图片压缩</h1>
      <p>减小照片和截图的文件体积，方便分享或保存。</p>
    </header>

    <div class="workbench">
      <section class="panel drop-zone" id="drop-zone" aria-labelledby="drop-title">
        <svg class="upload-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="9" y="10" width="30" height="28" rx="5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="19" cy="20" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="m10 33 8-7 5 4 7-8 8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2 id="drop-title">把图片拖到这里</h2>
        <p>JPG、PNG、WebP · 每张最多 30 MB</p>
        <input id="files" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden>
        <button class="button primary" id="pick" type="button" disabled>选择图片</button>
        <p class="privacy">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 7V5a3 3 0 0 1 6 0v2M8 10v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="3.5" y="7" width="9" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
          浏览器本地处理，图片不会上传
        </p>
      </section>

      <form class="panel compression-settings" id="settings">
        <h2>压缩设置</h2>
        <div class="settings">
          <label class="field">
            <span>输出格式</span>
            <select id="format" aria-describedby="format-note">
              <option value="image/webp">WebP</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
            </select>
          </label>
          <label class="field">
            <span>最长边上限</span>
            <select id="max-edge">
              <option value="1280">1280 px</option>
              <option value="1920">1920 px</option>
              <option value="2560" selected>2560 px</option>
              <option value="4096">4096 px</option>
            </select>
          </label>
        </div>
        <div class="quality-control">
          <div class="quality-head">
            <label for="quality">画质</label>
            <output id="quality-value" for="quality">80%</output>
          </div>
          <input id="quality" type="range" min="10" max="100" value="80" aria-describedby="format-note">
        </div>
        <p class="format-note" id="format-note">WebP 保留透明背景。长边超出上限时等比缩小。</p>
        <button class="button primary compress-button" id="compress" type="submit" disabled>开始压缩</button>
      </form>
    </div>

    <section class="panel image-list" aria-labelledby="results-title">
      <div class="list-head">
        <div>
          <h2 id="results-title">图片列表 <span class="count" id="count">0</span></h2>
          <p class="list-status" id="status" role="status">可一次处理最多 25 张图片。</p>
        </div>
        <button class="button quiet" id="clear" type="button" disabled>清空</button>
      </div>
      <div class="list-empty" id="empty">添加图片后，可在这里查看压缩结果并下载。</div>
      <ul id="results" class="image-results" aria-label="图片与压缩结果" hidden></ul>
      <noscript><p>请启用 JavaScript 后使用图片压缩。</p></noscript>
    </section>

    <p class="image-note">动图会导出为静态图片。重新编码会移除原图中的 EXIF 等元数据。若结果比原图大，列表会标出增加的比例。</p>
    <footer>EVAN'S TOOLBOX <span>图片压缩 · 本地处理</span></footer>
  </main>
</body>
</html>
