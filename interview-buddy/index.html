<!DOCTYPE html>

<meta name="color-scheme" content="light dark">
<title>InterviewBuddy · 面试题库</title>
<script>
/* 早期应用主题，避免刷新时闪白 */
(function () {
  var theme = null;
  try { theme = localStorage.getItem('ib-theme'); } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<script>
/* 主题切换：手动选择写入 localStorage，未选择时跟随系统 */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function current() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }

  function sync() {
    var dark = current() === 'dark';
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    var label = dark ? '切换浅色模式' : '切换深色模式';
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }

  btn.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ib-theme', next); } catch (e) {}
    sync();
  });

  if (mq) {
    var onSystemChange = function (e) {
      var saved = null;
      try { saved = localStorage.getItem('ib-theme'); } catch (err) {}
      if (saved) return;
      root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      sync();
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }

  sync();
})();
</script>
