<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151c16">
  <meta name="description" content="初代马力欧玩法的网页平台游戏，8 个世界、32 个原创关卡，支持键盘和触屏。">
  <title>超级玛丽 · Evan's Arcade</title>
  <link rel="stylesheet" href="../arcade/arcade.css">
  <link rel="stylesheet" href="mario.css?v=2">
  <script defer src="../arcade/arcade.js"></script>
  <script defer src="levels.js?v=2"></script>
  <script defer src="view.js?v=2"></script>
  <script defer src="game.js?v=7"></script>
</head>
<body class="mario">
  <main class="arcade">
    <nav class="arcade-nav" aria-label="街机导航">
      <a href="../">← 返回工具集</a>
      <span>EVAN’S <strong>ARCADE</strong></span>
      <a href="../thunder-fighter/">雷霆战机 ↗</a>
    </nav>
    <header class="game-heading">
      <div>
        <h1>超级玛丽</h1>
        <p class="intro">8 个世界、32 个原创关卡，沿用初代玩法。</p>
      </div>
      <div class="game-actions">
        <button type="button" data-sound aria-pressed="false">音效关</button>
        <button type="button" data-pause disabled>暂停</button>
        <a class="restart" href="./">重开 / 选关</a>
      </div>
    </header>
    <div class="game-layout">
      <section class="game-console" aria-label="超级玛丽游戏">
        <div class="hud" aria-label="游戏数据">
          <div>关卡 <strong data-stat="stage">1-1</strong></div>
          <div>金币 <strong data-stat="coins">00</strong></div>
          <div><span data-stat="player">MARIO</span> <strong data-stat="lives">3</strong></div>
          <div>时间 <strong data-stat="time">300</strong></div>
          <div>得分 <strong data-stat="score">000000</strong></div>
        </div>
        <div class="screen">
          <canvas width="384" height="240" aria-label="横版闯关画面">此浏览器不支持 Canvas。</canvas>
          <div class="overlay" data-overlay>
            <div class="overlay-card">
              <p class="eyebrow" data-overlay-tag>WORLD 1-1 → 8-4</p>
              <h2 data-overlay-title role="status">蘑菇王国大冒险</h2>
              <p data-overlay-copy></p>
              <div class="start-options" data-start-options>
                <label>起始关卡 <select data-practice aria-label="起始关卡"></select></label>
                <label>模式 <select data-players aria-label="模式"><option value="1">单人</option><option value="2">双人轮流</option></select></label>
              </div>
              <button class="play" type="button" data-play>开始游戏</button>
            </div>
          </div>
        </div>
        <div class="touch-controls" aria-label="屏幕按键">
          <button type="button" data-hold="left" aria-label="向左">←</button>
          <button type="button" data-hold="right" aria-label="向右">→</button>
          <button type="button" data-hold="down" aria-label="蹲下或进水管">↓</button>
          <button type="button" data-hold="run" aria-label="加速或发射火球">B 加速</button>
          <button type="button" data-hold="jump" aria-label="跳跃或游泳">A 跳跃</button>
        </div>
      </section>
      <aside class="field-guide" aria-label="玩法说明">
        <h2>操作</h2>
        <dl>
          <div><dt>移动</dt><dd><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></dd></div>
          <div><dt>跳跃、游泳、爬藤</dt><dd><kbd>空格</kbd> / <kbd>Z</kbd> / <kbd>↑</kbd></dd></div>
          <div><dt>加速、火球</dt><dd><kbd>X</kbd> / <kbd>Shift</kbd></dd></div>
          <div><dt>蹲下、进水管</dt><dd><kbd>↓</kbd> / <kbd>S</kbd></dd></div>
          <div><dt>暂停</dt><dd><kbd>P</kbd> / <kbd>Esc</kbd></dd></div>
        </dl>
        <p>按住跳跃可以跳得更高。在水里反复按跳跃划水。站在可进入的水管上按 ↓。</p>
        <p>从下方顶问号砖拿道具。从上方踩龟可以缩壳，碰空壳可以把它踢出去。</p>
      </aside>
    </div>
    <noscript>请启用 JavaScript 后开始游戏。</noscript>
  </main>
</body>
</html>
