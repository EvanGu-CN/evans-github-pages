  <!-- Loading Screen -->
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="loader">
      <span class="mta-bullet loader-bullet" aria-hidden="true">沭</span>
      <div class="loader-title">沭阳漫游</div>
      <div class="loader-track" aria-hidden="true"><span id="loading-progress" class="loader-fill"></span></div>
      <div id="loading-status">正在加载沭阳城市数据...</div>
    </div>
  </div>

  <!-- 3D WebGPU Viewport Container -->
  <main id="canvas-container" aria-label="沭阳三维城市场景"></main>

  <!-- Top-Left: Brand & Renderer Telemetry -->
  <header class="hud hud-top-left">
    <div class="panel brand">
      <span class="mta-bullet" aria-hidden="true">沭</span>
      <div class="brand-titles">
        <div class="brand-heading">
          <h1>沭阳漫游</h1>
          <a class="repo-link" href="https://github.com/mrdoob/slop-newyork/" target="_blank" rel="noopener noreferrer" aria-label="项目源仓库（新窗口打开）">源项目 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="brand-subtitle">江苏沭阳 · 城市漫游 · <span id="hud-fps" class="fps-ok">60</span> 帧/秒</div>
      </div>
    </div>
  </header>

  <!-- Top-Right Toolbar: Time of Day, Teleport, Map & Clean View -->
  <div class="hud hud-top-right">
    <div id="hud-toolbar" class="panel toolbar">
      <div class="time-switch" role="group" aria-label="氛围与时段">
        <button id="time-golden" class="time-btn active" data-time="golden" type="button" title="黄昏">
          <svg class="icon" aria-hidden="true"><use href="#i-golden"/></svg><span class="seg-label">黄昏</span>
        </button>
        <button id="time-midday" class="time-btn" data-time="midday" type="button" title="正午">
          <svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="seg-label">正午</span>
        </button>
        <button id="time-twilight" class="time-btn" data-time="twilight" type="button" title="蓝调时刻">
          <svg class="icon" aria-hidden="true"><use href="#i-twilight"/></svg><span class="seg-label">蓝调</span>
        </button>
        <button id="time-midnight" class="time-btn" data-time="midnight" type="button" title="夜晚 23:00">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="seg-label">夜晚</span>
        </button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-teleport" class="tool-btn" type="button" popovertarget="teleport-popover" title="传送到地标">
        <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg><span class="tool-label">传送</span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <button id="btn-open-map" class="tool-btn" type="button" title="沭阳城区街道图 [M]">
        <svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="tool-label">地图</span><kbd>M</kbd>
      </button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-sound" class="tool-btn icon-only" type="button" title="静音 [N]" aria-label="静音" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg>
      </button>
      <button id="btn-toggle-hud" class="tool-btn icon-only" type="button" title="简洁视图：隐藏界面 [H]" aria-label="隐藏界面" aria-pressed="false">
        <svg class="icon icon-hide" aria-hidden="true"><use href="#i-eye"/></svg><svg class="icon icon-show" aria-hidden="true"><use href="#i-eye-off"/></svg>
      </button>
    </div>
  </div>

    <button id="tp-nanhu" class="pop-item tp-btn" data-teleport="nanhu" type="button"><span class="pop-name">南湖公园</span><span class="pop-sub">南部新城 · 湖岸/岛屿/步行桥</span></button>

    <button id="tp-wanda" class="pop-item tp-btn" data-teleport="wanda" type="button"><span class="pop-name">万达广场</span><span class="pop-sub">南部新城</span></button>
    <button id="tp-wuyinxian" class="pop-item tp-btn" data-teleport="wuyinxian" type="button"><span class="pop-name">吴印咸故居</span><span class="pop-sub">老城 · 江淮民居</span></button>
    <button id="tp-cotton" class="pop-item tp-btn" data-teleport="cotton" type="button"><span class="pop-name">老服装厂休闲街区</span><span class="pop-sub">人民西路 · 旧厂房更新</span></button>

      <canvas id="minimap-canvas" aria-label="周边道路与建筑，上方为北"></canvas>
      <span class="radar-north" aria-hidden="true">北</span>
      <span class="radar-east" aria-hidden="true">东</span>
      <span class="radar-south" aria-hidden="true">南</span>
      <span class="radar-west" aria-hidden="true">西</span>
    </button>
  </div>
  <div class="hud hud-boost">
    <button id="btn-boost" class="panel boost-control" type="button" aria-label="开启持续加速" aria-pressed="false" title="点击切换持续加速；也可按住上档键临时加速">
      <span aria-hidden="true">»</span><span id="boost-label">加速</span>
    </button>
  </div>

  <!-- Bottom-Center: Third-Person Mode Switcher & Controls Guide -->
  <footer class="hud hud-bottom-center">
    <div id="hud-controls-hint" class="controls-hint"></div>
    <nav id="mode-switch" class="panel mode-switch" aria-label="第三人称出行方式">
      <span class="mode-indicator" aria-hidden="true"></span>
      <button id="mode-person" class="mode-btn" data-mode="person" type="button" title="步行 [1]">
        <svg class="icon" aria-hidden="true"><use href="#i-walk"/></svg><span class="mode-label">步行</span><kbd>1</kbd>
      </button>
      <button id="mode-car" class="mode-btn active" data-mode="car" type="button" title="出租车 [2]">
        <svg class="icon" aria-hidden="true"><use href="#i-car"/></svg><span class="mode-label">驾车</span><kbd>2</kbd>
      </button>
      <button id="mode-cyclist" class="mode-btn" data-mode="cyclist" type="button" title="自行车 [3]">
        <svg class="icon" aria-hidden="true"><use href="#i-bike"/></svg><span class="mode-label">骑行</span><kbd>3</kbd>
      </button>
      <button id="mode-helicopter" class="mode-btn" data-mode="helicopter" type="button" title="直升机 [4]">
        <svg class="icon" aria-hidden="true"><use href="#i-heli"/></svg><span class="mode-label">飞行</span><kbd>4</kbd>
      </button>
    </nav>
  </footer>

  <!-- Bottom-Right: Speed Cluster & Camera Switcher -->
  <div class="hud hud-bottom-right">
    <section id="hud-cluster" class="panel cluster" aria-label="速度、海拔与机位">
      <div class="gauge">
        <div class="gauge-top">
          <span id="hud-active-mode" class="gauge-label">沭阳出租车</span>
          <span class="gauge-alt"><span class="gauge-alt-label">海拔</span> <span id="hud-altitude">0</span> 米</span>
        </div>
        <div class="gauge-speed"><span id="hud-speed">0</span><span class="gauge-unit">千米/时</span></div>
        <div class="gauge-meter" aria-hidden="true"><span id="hud-speed-meter"></span></div>
      </div>
      <div id="camera-switch" class="camera-switch">
        <button id="cam-prev" class="icon-btn" type="button" title="上一个机位" aria-label="上一个机位">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <button id="cam-menu-btn" class="camera-current" type="button" popovertarget="camera-popover" title="全部机位 [V 切换]">
          <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span id="hud-active-camera">第三人称跟随</span><kbd>V</kbd>
        </button>
        <button id="cam-next" class="icon-btn" type="button" title="下一个机位 [V]" aria-label="下一个机位">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Touch input stays available in clean view; the map temporarily suspends it. -->
  <section id="touch-controls" aria-label="触屏操作" hidden>
    <div class="touch-movement">
      <div id="touch-stick" role="group" aria-label="移动摇杆：上下拖动前进或后退，左右拖动转向">
        <span class="touch-stick-axis" aria-hidden="true"></span>
        <span id="touch-stick-knob" aria-hidden="true"></span>
      </div>
      <span class="touch-caption">移动与转向</span>
    </div>
    <p class="touch-look-hint">拖动环视 · 双指缩放</p>
    <div class="touch-actions" role="group" aria-label="按住执行动作">
      <button class="touch-action" data-touch-action="up" type="button" aria-label="跳跃" aria-pressed="false" hidden>
        <span aria-hidden="true">↑</span><span data-touch-label="up">跳跃</span>
      </button>
      <button class="touch-action" data-touch-action="down" type="button" aria-label="下降" aria-pressed="false" hidden>
        <span aria-hidden="true">↓</span><span data-touch-label="down">下降</span>
      </button>
    </div>
  </section>

  <!-- All Cameras: 3 Follow Cameras + 7 Iconic NYC Vantage Cameras + Auto-Director Drone -->
  <div id="camera-popover" class="popover" popover data-side="above" data-anchor="hud-cluster" data-align="hud-cluster" aria-label="选择机位">
    <div class="pop-title">跟随</div>
    <button id="cam-chase" class="pop-item cam-btn active" data-camera="chase" type="button"><span class="pop-name">第三人称跟随</span><kbd>5</kbd></button>
    <button id="cam-action" class="pop-item cam-btn" data-camera="action" type="button"><span class="pop-name">低角度追车</span><kbd>6</kbd></button>
    <button id="cam-pov" class="pop-item cam-btn" data-camera="pov" type="button"><span class="pop-name">第一人称 / 驾驶舱</span><kbd>7</kbd></button>
    <div class="pop-title">风光</div>
    <button id="cam-centralPark" class="pop-item cam-btn" data-camera="centralPark" type="button"><span class="pop-name">南湖公园</span></button>
    <button id="cam-fifthAve" class="pop-item cam-btn" data-camera="fifthAve" type="button"><span class="pop-name">人民中路</span><kbd>8</kbd></button>
    <button id="cam-timesSquare" class="pop-item cam-btn" data-camera="timesSquare" type="button"><span class="pop-name">中央商场商圈</span><kbd>9</kbd></button>
    <button id="cam-chryslerGCT" class="pop-item cam-btn" data-camera="chryslerGCT" type="button"><span class="pop-name">县政府广场</span><kbd>0</kbd></button>
    <button id="cam-observatory" class="pop-item cam-btn" data-camera="observatory" type="button"><span class="pop-name">县城高空</span></button>
    <button id="cam-bryantPark" class="pop-item cam-btn" data-camera="bryantPark" type="button"><span class="pop-name">虞姬生态园</span></button>
    <button id="cam-waterfront" class="pop-item cam-btn" data-camera="waterfront" type="button"><span class="pop-name">沭河风光带</span></button>
    <button id="cam-drone" class="pop-item cam-btn" data-camera="drone" type="button"><span class="pop-name">自动巡游航拍</span></button>
  </div>

  <!-- Full-Screen Interactive New York City Street Map ([M]) -->
  <section id="fullmap-modal" class="fullmap-modal hidden" role="dialog" aria-modal="true" aria-label="沭阳城区交互街道图">
    <div id="fullmap-canvas-wrap" class="fullmap-canvas-wrap">
      <canvas id="fullmap-canvas"></canvas>
    </div>

    <div class="fullmap-header">
      <div class="panel fullmap-title">
        <span class="mta-bullet" aria-hidden="true">沭</span>
        <div>
          <h2>沭阳城区街道图</h2>
          <p id="fullmap-player-info" class="fullmap-subtitle">你在人民中路 &amp; 上海中路</p>
        </div>
      </div>
      <label class="panel fullmap-search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="fullmap-search" class="fullmap-search" type="text" placeholder="搜索小区、学校、医院、商场或道路…" aria-label="搜索小区、道路、建筑或地点" list="neighborhood-suggestions" autocomplete="off" spellcheck="false" />
        <datalist id="neighborhood-suggestions"></datalist>
      </label>
      <button id="close-fullmap-btn" class="panel tool-btn fullmap-close" type="button" title="关闭地图 [地图键 / 退出键]">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="tool-label">关闭</span><kbd>退出</kbd>
      </button>
    </div>

    <div class="map-controls">
      <div class="panel map-compass" title="正北 · 沭阳城区路网大致沿正南北/东西向">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <g id="map-compass-needle">
            <path d="M22 9.5 25.6 22h-7.2z" fill="#f05a4f"/>
            <path d="M22 34.5 25.6 22h-7.2z" fill="rgba(255,255,255,0.72)"/>
            <text x="22" y="8" text-anchor="middle">北</text>
          </g>
        </svg>
      </div>
      <div class="panel map-zoom">
        <button id="map-zoom-in" class="icon-btn" type="button" title="放大" aria-label="放大"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="map-zoom-out" class="icon-btn" type="button" title="缩小" aria-label="缩小"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <div class="panel map-zoom">
        <button id="map-center-player" class="icon-btn" type="button" title="回到当前位置" aria-label="回到当前位置"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        <button id="map-view-all" class="icon-btn" type="button" title="沭阳城区全图（学院路至大连路）" aria-label="沭阳城区全图"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
    </div>

    <div class="fullmap-footer">
      <div class="panel fullmap-status">
        <span id="fullmap-hover-info">点击任意位置传送 · 拖拽平移 · 滚轮缩放</span>
        <span class="fullmap-reference-links" aria-label="在外部地图核对搜索地点">
          <a id="map-reference-amap" href="https://uri.amap.com/search?keyword=沭阳县&amp;city=沭阳县&amp;view=map&amp;src=shuyang-city&amp;callnative=0" target="_blank" rel="noopener noreferrer">高德地图核对 ↗</a>
          <a id="map-reference-baidu" href="https://api.map.baidu.com/place/search?query=沭阳县&amp;region=沭阳县&amp;output=html&amp;src=webapp.shuyang-city" target="_blank" rel="noopener noreferrer">百度地图核对 ↗</a>
        </span>
      </div>
    </div>

    <div class="panel fullmap-legend">
      <span class="legend-item"><span class="legend-swatch player-swatch"></span>你</span>
      <span class="legend-item"><span class="legend-swatch landmark-swatch"></span>地标</span>
      <span class="legend-item"><span class="legend-swatch neighborhood-swatch"></span>小区</span>
      <span class="legend-item"><span class="legend-swatch gps-swatch"></span>导航路线</span>
      <span class="legend-item"><span class="legend-swatch bridge-swatch"></span>桥梁 / 快速路</span>
      <span class="legend-item legend-attribution">© 开放街图贡献者 · Overture地图基金会 · ODbL · CNBH-10m / Wu · CC BY 4.0 · 影像参考：Esri / Vantor（2021年，近似补录）</span>
      <span id="fullmap-counts" class="legend-counts"></span>
    </div>
  </section>

</body>
</html>
